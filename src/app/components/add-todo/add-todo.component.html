<div class="add-todo-container">
  <div class="add-todo-card">
    <h3 class="add-todo-title">
      <mat-icon>add_task</mat-icon>
      Add New Task
    </h3>
    <form [formGroup]="todoForm" (ngSubmit)="addTodo()" class="add-todo-form">
      <div class="input-container">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>What needs to be done?</mat-label>
          <input
            matInput
            formControlName="title"
            placeholder="e.g., Buy groceries, Call dentist..."
            maxlength="100"
            #todoInput>
          <mat-icon matSuffix class="input-icon">edit</mat-icon>
          <mat-hint class="char-counter">{{ todoForm.get('title')?.value?.length || 0 }}/100</mat-hint>
          <mat-error *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched">
            {{ getErrorMessage() }}
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!todoForm.valid || isSubmitting"
          class="add-button">
          <mat-icon>{{ isSubmitting ? 'hourglass_empty' : 'add_circle' }}</mat-icon>
          {{ isSubmitting ? 'Adding Task...' : 'Add Task' }}
        </button>

        <button
          mat-button
          type="button"
          (click)="clearForm()"
          [disabled]="!todoForm.get('title')?.value || isSubmitting"
          class="clear-button">
          <mat-icon>clear</mat-icon>
          Clear
        </button>
      </div>
    </form>
  </div>
</div>
